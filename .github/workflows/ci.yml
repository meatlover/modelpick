name: ci

on:
  # Branch pushes only: a vX.Y.Z tag runs check.sh in release.yml.
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The browser tests in check.sh need Node, the locked packages and
      # Playwright's Chromium.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: bash scripts/check.sh
      # The browser tests again, every UI op answered 400 ms late (CONTRIBUTING.md,
      # "Browser tests"): acting before the redraw shows up here.
      - run: bash scripts/e2e.sh
        env:
          E2E_OP_DELAY_MS: "400"
